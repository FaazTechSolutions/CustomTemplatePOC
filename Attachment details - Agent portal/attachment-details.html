<div class="att-detail-widget">
  <style>
    /* ── Prevent FOUC ── */
    .att-detail-widget .hidden  { display: none !important; }
    .att-detail-widget .d-none  { display: none !important; }
  </style>

  <!-- ===== TOOLBAR ===== -->
  <div class="adt-toolbar">
    <div class="adt-toolbar-left">
      <div class="adt-toolbar-icon">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
          <line x1="16" y1="13" x2="8" y2="13"/>
          <line x1="16" y1="17" x2="8" y2="17"/>
          <polyline points="10 9 9 9 8 9"/>
        </svg>
      </div>
      <div>
        <h1 class="adt-toolbar-title">Attachment Details</h1>
        <p class="adt-toolbar-sub">View and download file attachments</p>
      </div>
    </div>
    <div class="adt-toolbar-right d-none">
      <div class="adt-status-badge" id="adt-status-badge">
        <span class="adt-badge-dot"></span>
        <span class="adt-badge-label" id="adt-badge-label">Loading…</span>
      </div>
    </div>
  </div>

  <!-- ===== LOADING SKELETON ===== -->
  <div class="adt-skeleton-wrap" id="adt-skeleton">
    <div class="adt-skeleton-card">
      <div class="adt-sk-row wide"></div>
      <div class="adt-sk-row medium"></div>
      <div class="adt-sk-row narrow"></div>
      <div class="adt-sk-file-row">
        <div class="adt-sk-file-icon"></div>
        <div class="adt-sk-file-info">
          <div class="adt-sk-row wide"></div>
          <div class="adt-sk-row narrow"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- ===== ERROR STATE ===== -->
  <div class="adt-error-state hidden" id="adt-error">
    <div class="adt-error-icon">
      <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
        stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <line x1="12" y1="8" x2="12" y2="12"/>
        <line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
    </div>
    <h3>Failed to load attachment</h3>
    <p id="adt-error-msg">An unexpected error occurred.</p>
    <button class="adt-btn-retry" id="adt-btn-retry">Try Again</button>
  </div>

  <!-- ===== MAIN DETAILS CARD ===== -->
  <div class="adt-details-wrap hidden" id="adt-details-wrap">

    <!-- Meta info bar -->
    <div class="adt-meta-bar" id="adt-meta-bar">
      <!-- Injected by JS -->
    </div>

    <!-- File card -->
    <div class="adt-file-card" id="adt-file-card">

      <!-- File Header -->
      <div class="adt-file-header">
        <div class="adt-file-type-icon" id="adt-file-type-icon">
          <!-- Injected by JS -->
        </div>
        <div class="adt-file-info">
          <p class="adt-file-name" id="adt-file-name">—</p>
          <p class="adt-file-meta" id="adt-file-meta">—</p>
        </div>
        <div class="adt-file-actions">
          <button class="adt-btn-action adt-btn-preview" id="adt-btn-preview" title="Preview file">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
            Preview
          </button>
          <button class="adt-btn-action adt-btn-download" id="adt-btn-download" title="Download file">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="7 10 12 15 17 10"/>
              <line x1="12" y1="15" x2="12" y2="3"/>
            </svg>
            Download
          </button>
        </div>
      </div>

      <!-- Inline preview panel (images / PDFs) -->
      <div class="adt-preview-panel hidden" id="adt-preview-panel">
        <div class="adt-preview-toolbar">
          <span class="adt-preview-label" id="adt-preview-label">Preview</span>
          <button class="adt-preview-close" id="adt-preview-close" title="Close preview">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
              stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"/>
              <line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
          </button>
        </div>
        <div class="adt-preview-content" id="adt-preview-content">
          <!-- Image or PDF iframe injected here -->
        </div>
      </div>

    </div><!-- /adt-file-card -->

    <!-- Additional fields section -->
    <div class="adt-fields-section" id="adt-fields-section">
      <div class="adt-fields-header">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
          stroke-linecap="round" stroke-linejoin="round">
          <line x1="8" y1="6" x2="21" y2="6"/>
          <line x1="8" y1="12" x2="21" y2="12"/>
          <line x1="8" y1="18" x2="21" y2="18"/>
          <line x1="3" y1="6" x2="3.01" y2="6"/>
          <line x1="3" y1="12" x2="3.01" y2="12"/>
          <line x1="3" y1="18" x2="3.01" y2="18"/>
        </svg>
        Record Information
      </div>
      <div class="adt-fields-grid" id="adt-fields-grid">
        <!-- Injected by JS -->
      </div>
    </div>

  </div><!-- /adt-details-wrap -->

  <!-- ===== LIGHTBOX / FULL-SCREEN PREVIEW ===== -->
  <div class="adt-lightbox hidden" id="adt-lightbox" role="dialog" aria-modal="true" aria-label="File preview">
    <div class="adt-lightbox-backdrop" id="adt-lightbox-backdrop"></div>
    <div class="adt-lightbox-inner">
      <div class="adt-lightbox-header">
        <span class="adt-lightbox-title" id="adt-lightbox-title">Preview</span>
        <div class="adt-lightbox-controls">
          <a class="adt-lb-btn" id="adt-lb-download" title="Download">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="7 10 12 15 17 10"/>
              <line x1="12" y1="15" x2="12" y2="3"/>
            </svg>
          </a>
          <button class="adt-lb-btn" id="adt-lb-close" title="Close">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
              stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"/>
              <line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
          </button>
        </div>
      </div>
      <div class="adt-lightbox-body" id="adt-lightbox-body">
        <!-- iframe / img injected here -->
      </div>
    </div>
  </div>

  <!-- ===== TOAST ===== -->
  <div class="adt-toast hidden" id="adt-toast" role="alert" aria-live="polite">
    <div class="adt-toast-icon" id="adt-toast-icon">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
        stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"/>
      </svg>
    </div>
    <span class="adt-toast-msg" id="adt-toast-msg">Done</span>
  </div>

  <!-- ── Dependencies (CDN) ── -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css"/>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="attachment-details.css"/>
  <script src="attachment-details.js"></script>
</div>
