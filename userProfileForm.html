<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/handlebars@latest/dist/handlebars.min.js"></script>

    <style>
        .user-form-card {
            max-width: 580px;
            /* background: #ffffff; */
            padding: 30px;
            /* border-radius: 12px; */
            /* box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05); */
            margin: 0 auto;
            /* box-sizing: border-box; */
        }

        /* Attachment / Profile Upload Area */
        .user-form-card .profile-upload-wrapper {
            margin-bottom: 25px;
        }

        .user-form-card .profile-upload-box {
            width: 105px;
            height: 105px;
            border: 2.5px solid #8e9bb0;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            background-color: #fff;
            transition: all 0.2s ease-in-out;
        }

        .user-form-card .profile-upload-box:hover {
            border-color: #4a6cf7;
            background-color: #f4f7ff;
        }

        .user-form-card .profile-upload-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .user-form-card .upload-icon-svg {
            width: 68px;
            height: 68px;
            color: #1a2533;
        }

        /* Form Row Layout */
        .user-form-card .form-field-row {
            display: flex;
            align-items: center;
            margin-bottom: 16px;
        }

        .user-form-card .form-field-label {
            width: 160px;
            font-size: 14px;
            font-weight: 500;
            color: #555555;
            padding-right: 10px;
        }

        .user-form-card .required-star {
            color: #e53935;
            margin-left: 2px;
        }

        .user-form-card .form-field-input-wrap {
            flex: 1;
        }

        .user-form-card .form-control-custom {
            width: 100%;
            padding: 8px 14px;
            font-size: 14px;
            color: #495057;
            border: 1px solid #c9d2de;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .user-form-card .form-control-custom::placeholder {
            color: #adb5bd;
            font-weight: 400;
        }

        .user-form-card .form-control-custom:focus {
            border-color: #ffaa00;
            box-shadow: 0 0 0 3px rgba(255, 170, 0, 0.15);
        }

        .user-form-card .form-control-custom.is-invalid {
            border-color: #d93025 !important;
            box-shadow: 0 0 0 3px rgba(217, 48, 37, 0.15) !important;
        }

        .user-form-card .invalid-feedback-custom {
            color: #d93025;
            font-size: 12px;
            margin-top: 5px;
            display: none;
        }

        /* Action Buttons */
        .user-form-card .form-actions-row {
            display: flex;
            gap: 12px;
            margin-top: 30px;
        }

        .user-form-card .btn-custom-submit {
            background-color: #ffffff;
            color: #ffaa00;
            border: 1.5px solid #ffaa00;
            border-radius: 6px;
            padding: 6px 22px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 90px;
        }

        .user-form-card .btn-custom-submit:hover {
            background-color: #fff9ed;
            color: #e69900;
            border-color: #e69900;
        }

        .user-form-card .btn-custom-close {
            background-color: #ffffff;
            color: #d93025;
            border: 1.5px solid #d93025;
            border-radius: 6px;
            padding: 6px 22px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 80px;
        }

        .user-form-card .btn-custom-close:hover {
            background-color: #fdf2f2;
            color: #b3261e;
            border-color: #b3261e;
        }

        /* Loader Spinner */
        .user-form-card .btn-spinner {
            width: 16px;
            height: 16px;
            border: 2px solid #ffaa00;
            border-top: 2px solid transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-left: 8px;
            display: inline-block;
        }

        .user-form-card .hidden-in-edit {
            display: none !important;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <div class="user-form-card">
        <form id="userCreateForm">
            <input type="hidden" id="isEdit" value="No">
            <input type="hidden" id="RecId" value="">
            <!-- Profile / Attachment Upload Box -->
            <div class="profile-upload-wrapper">
                <div class="profile-upload-box" id="profileUploadBox"
                    title="{{Translate 'Click to upload profile picture'}}">
                    <div id="placeholderContent" class="text-center">
                        <svg class="upload-icon-svg" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <!-- Rounded Outer Frame -->
                            <rect x="8" y="8" width="48" height="48" rx="8" stroke="#1f2937" stroke-width="3.5"
                                fill="none" />
                            <!-- Mountain / Landscape lines -->
                            <path d="M12 48L24 34L32 42L44 26L52 38V48H12Z" stroke="#1f2937" stroke-width="3"
                                stroke-linecap="round" stroke-linejoin="round" fill="none" />
                            <!-- Sun circle -->
                            <circle cx="23" cy="23" r="4" stroke="#1f2937" stroke-width="3" fill="none" />
                            <!-- Upload Arrow in top right -->
                            <path d="M45 22V10M45 10L39 16M45 10L51 16" stroke="#1f2937" stroke-width="3.5"
                                stroke-linecap="round" stroke-linejoin="round" />
                        </svg>
                    </div>
                    <img id="profilePreviewImg" src="" alt="{{Translate 'Profile Preview'}}" style="display: none;" />
                </div>
                <input type="file" id="ProfileFileInput" accept="image/*" style="display: none;">
            </div>
            <!-- Employee Id -->
            <div class="form-field-row">
                <label for="EmployeeId" class="form-field-label">{{Translate 'Employee Id'}}<span class="required-star">*</span></label>
                <div class="form-field-input-wrap">
                    <input type="text" id="EmployeeId" name="EmployeeId" class="form-control-custom"
                        placeholder="{{Translate 'Employee Id'}}" minlength="6" maxlength="15" required>
                    <div id="employeeIdError" class="invalid-feedback-custom"></div>
                </div>
            </div>

            <!-- Name -->
            <div class="form-field-row">
                <label for="Name" class="form-field-label">{{Translate 'Name'}}<span class="required-star">*</span></label>
                <div class="form-field-input-wrap">
                    <input type="text" id="Name" name="Name" class="form-control-custom" placeholder="{{Translate 'Name'}}" required>
                </div>
            </div>

            <!-- User Id -->
            <div class="form-field-row" id="userIdRow">
                <label for="UserId" class="form-field-label">{{Translate 'User Id'}}<span class="required-star">*</span></label>
                <div class="form-field-input-wrap">
                    <input type="text" id="UserId" name="UserId" class="form-control-custom" placeholder="{{Translate 'User Id'}}"
                        minlength="5" maxlength="50" required>
                    <div id="userIdError" class="invalid-feedback-custom"></div>
                </div>
            </div>

            <!-- Email -->
            <div class="form-field-row">
                <label for="Email" class="form-field-label">{{Translate 'Email'}}</label>
                <div class="form-field-input-wrap">
                    <input type="email" id="Email" name="Email" class="form-control-custom" placeholder="{{Translate 'Email'}}">
                    <div id="emailError" class="invalid-feedback-custom"></div>
                </div>
            </div>

            <!-- Mobile Number -->
            <div class="form-field-row">
                <label for="MobileNumber" class="form-field-label">{{Translate 'Mobile Number'}}<span
                        class="required-star">*</span></label>
                <div class="form-field-input-wrap">
                    <input type="text" id="MobileNumber" name="MobileNumber" class="form-control-custom"
                        placeholder="{{Translate 'Mobile Number'}}" minlength="8" maxlength="15" required>
                    <div id="mobileNumberError" class="invalid-feedback-custom"></div>
                </div>
            </div>

            

            <!-- Password -->
            <div class="form-field-row" id="passwordRow">
                <label for="Password" class="form-field-label">{{Translate 'Password'}}<span class="required-star">*</span></label>
                <div class="form-field-input-wrap">
                    <input type="password" id="Password" name="Password" class="form-control-custom"
                        placeholder="{{Translate 'Password'}}" required>
                </div>
            </div>

            <!-- Confirm Password -->
            <div class="form-field-row" id="confirmPasswordRow">
                <label for="confirmPassword" class="form-field-label">{{Translate 'Confirm Password'}}<span
                        class="required-star">*</span></label>
                <div class="form-field-input-wrap">
                    <input type="password" id="confirmPassword" name="confirmPassword" class="form-control-custom"
                        placeholder="{{Translate 'Confirm Password'}}" required>
                </div>
            </div>

            <!-- Buttons -->
            <div class="form-actions-row">
                <button type="button" class="btn-custom-submit" id="btnSubmit">
                    <span id="btnSubmitText">{{Translate 'Submit'}}</span>
                    <span id="submitSpinner" class="btn-spinner" style="display: none;"></span>
                </button>
                <button type="button" class="btn-custom-close" id="btnCloseForm">{{Translate 'Close'}}</button>
            </div>
        </form>
    </div>

        function registerTranslateHelper() {
            if (typeof Handlebars === 'undefined') return;
            Handlebars.registerHelper('Translate', function (value) {
                let _ret = value;
                if (!value)
                    _ret = "";

                let Lang = localStorage.getItem("CurrentLanguage");

                if (!Lang) {
                    return _ret;
                }
                if (!(window.location.hostname === "portal.mawarid.com.sa")) {
                    return _ret;
                }
                if (typeof _this === "undefined" || !_this.globalService || !_this.globalService.systemLabels) {
                    return _ret;
                }

                try {
                    if (value.substring(0, 3) == "LBL") {
                        let _label = _this.globalService.systemLabels.filter(x => x.LabelId == value)[0];
                        if (_label) {
                            let _retVal = value;
                            if (_label[Lang]) {
                                _retVal = _label[Lang];
                            } else if (_label.DefaultValue) {
                                _retVal = _label.DefaultValue;
                            }
                            _ret = _retVal;
                        } else {
                            _ret = value;
                        }
                    } else {
                        let _value = value.toLowerCase().trim();
                        let _label = _this.globalService.systemLabels.filter(x => x.DefaultValue && x.DefaultValue.toLowerCase().trim() == _value)[0];
                        if (_label) {
                            _ret = _label[Lang] ? _label[Lang] : value;
                        } else {
                            _ret = value;
                        }
                    }
                } catch (error) {
                    _ret = value;
                }

                return _ret;
            });
        }

        if (typeof Handlebars !== 'undefined') {

                return Handlebars.helpers.Translate(value);

            let _ret = value;

            if (typeof _this === "undefined" || !_this.globalService || !_this.globalService.systemLabels) return _ret;
            try {
                if (value.substring(0, 3) == "LBL") {
                    let _label = _this.globalService.systemLabels.filter(x => x.LabelId == value)[0];
                    if (_label) {
                        if (_label[Lang]) return _label[Lang];
                        if (_label.DefaultValue) return _label.DefaultValue;
                    }
                } else {
                    let _value = value.toLowerCase().trim();
                    let _label = _this.globalService.systemLabels.filter(x => x.DefaultValue && x.DefaultValue.toLowerCase().trim() == _value)[0];
                    if (_label && _label[Lang]) return _label[Lang];
                }
            } catch (e) { }
            return _ret;

        function applyEditModeUI(isEdit) {
            if (isEdit) {
                $('#userIdRow, #passwordRow, #confirmPasswordRow').hide().addClass('hidden-in-edit');
                $('#UserId, #Password, #confirmPassword').prop('required', false);
            } else {
                $('#userIdRow, #passwordRow, #confirmPasswordRow').removeClass('hidden-in-edit').show();
                $('#UserId, #Password, #confirmPassword').prop('required', true);
            }
        }

        $(document).ready(function () {
            $("#isEdit").val('No');
            if (typeof _this !== "undefined" && _this.ParentData && _this.ParentData.RecId) {
                $("#isEdit").val('Yes');
                $('#btnSubmitText').text(translate('Update'));
                applyEditModeUI(true);
                setFormValue(_this.ParentData);
            } else {
                $('#btnSubmitText').text(translate('Submit'));
                applyEditModeUI(false);
            }
        });

        function setFormValue(response) {
            if (!response) return;

            $("#isEdit").val('Yes');
            $('#btnSubmitText').text(translate('Update'));
            applyEditModeUI(true);

            if (response.RecId) {
                $("#RecId").val(response.RecId);
            }
            if (response.EmployeeId) {
                $("#EmployeeId").val(response.EmployeeId);
            }
            if (response.Name) {
                $("#Name").val(response.Name);
            }
            if (response.UserId) {
                $("#UserId").val(response.UserId);
            }
            if (response.Email) {
                $("#Email").val(response.Email);
            }
            if (response.MobileNumber) {
                $("#MobileNumber").val(response.MobileNumber);
            }
            if (response.Password) {
                $("#Password").val(response.Password);
                $("#confirmPassword").val(response.Password);
            }
            if (response.Profile || response.Profile_Path) {
                const profilePath = response.Profile || response.Profile_Path;
                const profileSrc = profilePath.startsWith('http')
                    ? profilePath
                    : `${Apps4xApiUrl}${profilePath.replace(/^\/+/, '')}`;
                $('#placeholderContent').hide();
                $('#profilePreviewImg').attr('src', profileSrc).show();
            }
        }

        // Preview selected profile image
        function handleFileSelect(event) {
            const files = (event && event.target && event.target.files)
                ? event.target.files
                : (event && event.originalEvent && event.originalEvent.target && event.originalEvent.target.files)
                    ? event.originalEvent.target.files
                    : $('#ProfileFileInput')[0]?.files;
            const file = files && files[0];
            if (file) {
                selectedFile = file;
                const reader = new FileReader();
                reader.onload = function (e) {
                    $('#placeholderContent').hide();
                    $('#profilePreviewImg').attr('src', e.target.result).show();
                };
                reader.readAsDataURL(file);
            }
        }

        // Show/Hide loader state
        function setLoading(isLoading) {
            if (isLoading) {
                $('#btnSubmit').prop('disabled', true);
                $('#submitSpinner').show();
            } else {
                $('#btnSubmit').prop('disabled', false);
                $('#submitSpinner').hide();
            }
        }

        // Reset form inputs & image preview
        function resetForm() {
            clearTimeout(employeeCheckTimeout);
            selectedFile = null;
            $('#ProfileFileInput').val('');
            $('#UserId').removeClass('is-invalid');
            $('#userIdError').text('').hide();
            $('#Email').removeClass('is-invalid');
            $('#emailError').text('').hide();
            $('#MobileNumber').removeClass('is-invalid');
            $('#mobileNumberError').text('').hide();
            $('#EmployeeId').removeClass('is-invalid');
            $('#employeeIdError').text('').hide();

            if ($("#isEdit").val() === "Yes" && typeof _this !== "undefined" && _this.ParentData && _this.ParentData.RecId) {
                applyEditModeUI(true);
                setFormValue(_this.ParentData);
            } else {
                document.getElementById('userCreateForm').reset();
                applyEditModeUI(false);
                $('#btnSubmitText').text(translate('Submit'));
                $('#profilePreviewImg').attr('src', '').hide();
                $('#placeholderContent').show();
                $('#RecId').val('');
            }
        }

            resetForm();

        // Validate UserId length (min 5, max 50 characters)
        function validateUserId(userIdVal) {
            if (!userIdVal) {
                $('#UserId').removeClass('is-invalid');
                $('#userIdError').text('').hide();
                return { isValid: false, reason: 'empty' };
            }

            if (userIdVal.length < 5) {
                $('#UserId').addClass('is-invalid');
                $('#userIdError').text(translate('User Id should be minimum 5 characters.')).show();
                return { isValid: false, reason: 'min_length' };
            }

            if (userIdVal.length > 50) {
                $('#UserId').addClass('is-invalid');
                $('#userIdError').text(translate('User Id cannot exceed 50 characters.')).show();
                return { isValid: false, reason: 'max_length' };
            }

            $('#UserId').removeClass('is-invalid');
            $('#userIdError').text('').hide();
            return { isValid: true };
        }

        // Real-time check on UserId input change
        $(document).on('input change', '#UserId', function () {
            const val = $(this).val().trim();
            if (val) {
                validateUserId(val);
            } else {
                $('#UserId').removeClass('is-invalid');
                $('#userIdError').text('').hide();
            }
        });

        // Validate Email format
        function validateEmail(emailVal) {
            if (!emailVal) {
                $('#Email').removeClass('is-invalid');
                $('#emailError').text('').hide();
                return { isValid: true };
            }

            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(emailVal)) {
                $('#Email').addClass('is-invalid');
                $('#emailError').text(translate('Please enter a valid email address.')).show();
                return { isValid: false };
            }

            $('#Email').removeClass('is-invalid');
            $('#emailError').text('').hide();
            return { isValid: true };
        }

        // Real-time check on Email input change
        $(document).on('input change', '#Email', function () {
            const val = $(this).val().trim();
            validateEmail(val);
        });

        // Validate Mobile Number length (min 8, max 15 characters)
        function validateMobileNumber(mobileVal) {
            if (!mobileVal) {
                $('#MobileNumber').removeClass('is-invalid');
                $('#mobileNumberError').text('').hide();
                return { isValid: false, reason: 'empty' };
            }

            if (mobileVal.length < 8) {
                $('#MobileNumber').addClass('is-invalid');
                $('#mobileNumberError').text(translate('Mobile number should be minimum 8 characters.')).show();
                return { isValid: false, reason: 'min_length' };
            }

            if (mobileVal.length > 15) {
                $('#MobileNumber').addClass('is-invalid');
                $('#mobileNumberError').text(translate('Mobile number cannot exceed 15 characters.')).show();
                return { isValid: false, reason: 'max_length' };
            }

            $('#MobileNumber').removeClass('is-invalid');
            $('#mobileNumberError').text('').hide();
            return { isValid: true };
        }

        // Real-time check on MobileNumber input change
        $(document).on('input change', '#MobileNumber', function () {
            const val = $(this).val().trim();
            if (val) {
                validateMobileNumber(val);
            } else {
                $('#MobileNumber').removeClass('is-invalid');
                $('#mobileNumberError').text('').hide();
            }
        });

        /**
         * Fetches employee details from ERP by EmployeeId or Name.
         * Endpoint: https://bcp.mawarid.com.sa/api/v1/erp/getEmployeeDetailsByEmployeeIdOrName?_employeeIdOrName={employeeId}&_Company=MWD&user-id=SelfService
         */
        async function getEmployeeDetailsByEmployeeId(empId) {
            if (!empId) return { success: false, data: [] };

            const apiUrl = `${bcpUrl}/api/v1/erp/getEmployeeDetailsByEmployeeIdOrName?_employeeIdOrName=${encodeURIComponent(empId)}&_Company=MWD&user-id=SelfService`;

            const response = await fetch(apiUrl, {
                method: "GET",
                headers: {
                    "accept": "*/*",
                    "content-type": "application/json"
                }
            });

            if (!response.ok) {
                throw new Error(`Failed to fetch ERP employee details: HTTP ${response.status}`);
            }

            const data = await response.json();
            const list = (data && Array.isArray(data.RetListValue)) ? data.RetListValue : [];
            return {
                success: data && data.Success === true,
                data: list
            };
        }

        /**
         * Validates whether an EmployeeId already exists in Users collection.
         * Filter syntax matches: ?$filter:EmployeeId=eq:{EmployeeId}&$filter:UserId=ne:{UserId}
         */
        async function checkDuplicateEmployee(employeeId, excludeUserId) {
            if (!employeeId) return { isDuplicate: false, users: [] };

            let checkApiUrl = `${Apps4xApiUrl}api/v1/data/${companyId}?collectionId=${UserTableCollectionId}&entityid=${UserEntityId}&$filter:EmployeeId=eq:${encodeURIComponent(employeeId)}`;
            if (excludeUserId) {
                checkApiUrl += `&$filter:UserId=ne:${encodeURIComponent(excludeUserId)}`;
            }

            const response = await fetch(checkApiUrl, {
                method: "GET",
                headers: {
                    "accept": "application/json",
                    "appid": appId,
                    "authorization": "Bearer " + token,
                    "companyid": companyId,
                    "user-id": userId
                }
            });

            if (!response.ok) {
                const errText = await response.text();
                throw new Error(errText || `Failed to check duplicate employee: HTTP ${response.status}`);
            }

            const result = await response.json();
            const list = (result && Array.isArray(result.Data)) ? result.Data : [];
            return {
                isDuplicate: list.length > 0,
                users: list
            };
        }

        /**
         * Validates EmployeeId length, checks ERP record, auto-populates Name, and checks duplicate.
         */
        async function validateAndFetchEmployee(empId) {
            const currentUserId = $('#UserId').val().trim();

            if (!empId) {
                $('#Name').val('');
                $('#EmployeeId').removeClass('is-invalid');
                $('#employeeIdError').text('').hide();
                return { isValid: false, reason: 'empty' };
            }

            // Minimum 6 and maximum 15 characters validation
            if (empId.length < 6) {
                $('#Name').val('');
                $('#EmployeeId').addClass('is-invalid');
                $('#employeeIdError').text(translate('Employee ID should be minimum 6 characters.')).show();
                return { isValid: false, reason: 'min_length' };
            }

            if (empId.length > 15) {
                $('#Name').val('');
                $('#EmployeeId').addClass('is-invalid');
                $('#employeeIdError').text(translate('Employee ID cannot exceed 15 characters.')).show();
                return { isValid: false, reason: 'max_length' };
            }

            try {
                // Call ERP API
                const erpRes = await getEmployeeDetailsByEmployeeId(empId);
                if (!erpRes.data || erpRes.data.length === 0) {
                    $('#Name').val('');
                    $('#EmployeeId').addClass('is-invalid');
                    $('#employeeIdError').text(translate('Employee not found in ERP records.')).show();
                    return { isValid: false, reason: 'not_found' };
                }

                // If response exists, automatically fetch employeeName into Name input, otherwise clear it
                const emp = erpRes.data[0];
                if (emp && emp.employeeName) {
                    $('#Name').val(emp.employeeName);
                } else {
                    $('#Name').val('');
                }

                // Next, validate duplicate in Users table
                const dupRes = await checkDuplicateEmployee(empId, currentUserId);
                if (dupRes.isDuplicate) {
                    $('#EmployeeId').addClass('is-invalid');
                    $('#employeeIdError').text(translate('Employee ID is already registered try a Different Employee Id')).show();
                    return { isValid: false, reason: 'duplicate' };
                }

                // All validations passed
                $('#EmployeeId').removeClass('is-invalid');
                $('#employeeIdError').text('').hide();
                return { isValid: true, employee: emp };
            } catch (err) {
                console.error("Employee validation error:", err);
                $('#Name').val('');
                $('#EmployeeId').addClass('is-invalid');
                $('#employeeIdError').text(translate('Failed to validate Employee ID. Please try again.')).show();
                return { isValid: false, reason: 'error', error: err };
            }
        }

        // Real-time check while employeeid input change
        $(document).on('input', '#EmployeeId', function () {
            const empId = $(this).val().trim();
            clearTimeout(employeeCheckTimeout);

            if (!empId) {
                $('#Name').val('');
                $('#EmployeeId').removeClass('is-invalid');
                $('#employeeIdError').text('').hide();
                return;
            }

            if (empId.length < 6) {
                $('#Name').val('');
                $('#EmployeeId').addClass('is-invalid');
                $('#employeeIdError').text(translate('Employee ID should be minimum 6 characters.')).show();
                return;
            }

            if (empId.length > 15) {
                $('#Name').val('');
                $('#EmployeeId').addClass('is-invalid');
                $('#employeeIdError').text(translate('Employee ID cannot exceed 15 characters.')).show();
                return;
            }

            // Debounce ERP lookup while typing
            employeeCheckTimeout = setTimeout(() => {
                validateAndFetchEmployee(empId);
            }, 400);
        });

        // Instant validation on blur or change
        $(document).on('change', '#EmployeeId', function () {
            clearTimeout(employeeCheckTimeout);
            const empId = $(this).val().trim();
            validateAndFetchEmployee(empId);
        });

        // Form Submit Handler
        async function submitUserProfile() {
            const isEditMode = $("#isEdit").val() === "Yes";
            const name = $('#Name').val().trim();
            const userIdVal = $('#UserId').val().trim();
            const email = $('#Email').val().trim();
            const mobileNumber = $('#MobileNumber').val().trim();
            const employeeId = $('#EmployeeId').val().trim();
            const password = $('#Password').val();
            const confirmPassword = $('#confirmPassword').val();

            // Password confirmation check (only in create mode)
            if (!isEditMode) {
                if (password !== confirmPassword) {
                    Swal.fire({
                        icon: 'warning',
                        title: translate('Password Mismatch'),
                        text: translate('Password and Confirm Password do not match.')
                    });
                    return;
                }
            }

            // User Id validation (5 - 50 characters) - only in create mode
            if (!isEditMode) {
                const userIdValidation = validateUserId(userIdVal);
                if (!userIdValidation.isValid) {
                    $('#UserId').focus();
                    const msg = userIdValidation.reason === 'max_length'
                        ? translate('User Id cannot exceed 50 characters.')
                        : translate('User Id should be minimum 5 characters.');
                    Swal.fire({
                        icon: 'warning',
                        title: translate('Invalid User Id'),
                        text: msg
                    });
                    return;
                }
            }

            // Email validation (if entered)
            const emailValidation = validateEmail(email);
            if (!emailValidation.isValid) {
                $('#Email').focus();
                Swal.fire({
                    icon: 'warning',
                    title: translate('Invalid Email'),
                    text: translate('Please enter a valid email address.')
                });
                return;
            }

            // Mobile Number validation (8 - 15 characters)
            const mobileValidation = validateMobileNumber(mobileNumber);
            if (!mobileValidation.isValid) {
                $('#MobileNumber').focus();
                const msg = mobileValidation.reason === 'max_length'
                    ? translate('Mobile number cannot exceed 15 characters.')
                    : translate('Mobile number should be minimum 8 characters.');
                Swal.fire({
                    icon: 'warning',
                    title: translate('Invalid Mobile Number'),
                    text: msg
                });
                return;
            }

            // Employee ID length validation (6 - 15 characters)
            if (employeeId.length < 6 || employeeId.length > 15) {
                $('#EmployeeId').addClass('is-invalid');
                const msg = employeeId.length < 6
                    ? translate('Employee ID should be minimum 6 characters.')
                    : translate('Employee ID cannot exceed 15 characters.');
                $('#employeeIdError').text(msg).show();
                $('#EmployeeId').focus();
                Swal.fire({
                    icon: 'warning',
                    title: translate('Invalid Employee ID'),
                    text: msg
                });
                return;
            }

            setLoading(true);

            // Validate employee in ERP and verify uniqueness
            try {
                const validation = await validateAndFetchEmployee(employeeId);
                if (!validation.isValid) {
                    setLoading(false);
                    $('#EmployeeId').focus();

                    let errorMsg = translate('Please provide a valid Employee ID.');
                    if (validation.reason === 'min_length') {
                        errorMsg = translate('Employee ID should be minimum 6 characters.');
                    } else if (validation.reason === 'max_length') {
                        errorMsg = translate('Employee ID cannot exceed 15 characters.');
                    } else if (validation.reason === 'not_found') {
                        errorMsg = translate('Employee not found in ERP records. Submission not allowed.');
                    } else if (validation.reason === 'duplicate') {
                        errorMsg = translate('Employee ID is already registered try a Different Employee Id');
                    }

                    Swal.fire({
                        icon: 'error',
                        title: translate('Validation Failed'),
                        text: errorMsg
                    });
                    return;
                }
            } catch (valErr) {
                setLoading(false);
                console.error("Validation error:", valErr);
                Swal.fire({
                    icon: 'error',
                    title: translate('Validation Error'),
                    text: translate('Failed to verify Employee ID.') + ' ' + (valErr.message || '')
                });
                return;
            }

            // Construct payload matching exact curl request structure
            const currentUserIdVal = userIdVal || (isEditMode && typeof _this !== "undefined" && _this.ParentData ? _this.ParentData.UserId : "");

            const payload = {
                "Name": name,
                "UserId": currentUserIdVal,
                "Email": email || null,
                "MobileNumber": mobileNumber,
                "EmployeeId": employeeId,
                "AppId": appId,
                "EntityId": UserEntityId,
            };

            if (!isEditMode) {
                payload["Password"] = password;
            } else if (password || (typeof _this !== "undefined" && _this.ParentData && _this.ParentData.Password)) {
                payload["Password"] = password || _this.ParentData.Password;
            }

            if (isEditMode) {
                const recIdVal = $('#RecId').val() || (typeof _this !== "undefined" && _this.ParentData && _this.ParentData.RecId);
                if (recIdVal) {
                    payload["RecId"] = Number(recIdVal);
                }
                if (typeof _this !== "undefined" && _this.ParentData && _this.ParentData.Id) {
                    payload["Id"] = _this.ParentData.Id;
                }
            }

            if (selectedFile) {
                payload["Profile"] = selectedFile.name;
            } else if (isEditMode && typeof _this !== "undefined" && _this.ParentData && _this.ParentData.Profile) {
                payload["Profile"] = _this.ParentData.Profile;
            }

            try {
                let apiUrl = "";
                let methodType = "POST";

                if (isEditMode) {
                    apiUrl = selectedFile
                        ? `${Apps4xApiUrl}api/v1/data/${companyId}/update?FieldName=Profile`
                        : `${Apps4xApiUrl}api/v1/data/${companyId}/update`;
                    methodType = "PUT";
                } else {
                    apiUrl = selectedFile
                        ? `${Apps4xApiUrl}api/v1/data/${companyId}/Create?FieldName=Profile`
                        : `${Apps4xApiUrl}api/v1/data/${companyId}/create`;
                    methodType = "POST";
                }

                const formData = new FormData();
                formData.append("EntityData", JSON.stringify(payload));

                // Attach file if selected
                if (selectedFile) {
                    formData.append("Files", selectedFile, selectedFile.name);
                }

                const response = await fetch(apiUrl, {
                    method: methodType,
                    headers: {
                        "Authorization": "Bearer " + token,
                        "User-Id": userId,
                        "appid": appId,
                        "CompanyId": companyId
                    },
                    body: formData
                });

                if (!response.ok) {
                    const text = await response.text();
                    throw new Error(text || response.statusText);
                }

                const data = await response.json();
                setLoading(false);

                if (typeof data === "string" && data.toLowerCase().includes("error")) {
                    Swal.fire(translate("Error"), translate(data), "error");
                    return;
                }

                const successMsg = isEditMode
                    ? translate("User profile updated successfully!")
                    : translate("User profile created successfully!");

                Swal.fire({
                    icon: "success",
                    title: translate("Success"),
                    text: successMsg
                }).then(() => {
                    if (!isEditMode) {
                        resetForm();
                    }
                });
            } catch (error) {
                setLoading(false);
                console.error("API Error:", error);
                Swal.fire(translate("Submission Error"), translate(error.message || "Failed to submit request."), "error");
            }
        }
    </script>
