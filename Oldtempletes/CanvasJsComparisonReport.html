<!DOCTYPE HTML>
<html>

<head>
    <script>
        window.onload = function () {
            var jsonData = [
                {
                    "ContractNumber": "CON0000065",
                    "ContractType": "Contract",
                    "AgentId": "AG0000001",
                    "GuaranteeDays": 30,
                    "Fees": 100,
                    "ArrivalDays": 60,
                    "PenaltyClause": 75
                },
                {
                    "ContractNumber": "CON0000066",
                    "ContractType": "Contract",
                    "AgentId": "AG0000002",
                    "GuaranteeDays": 20,
                    "Fees": 3000,
                    "ArrivalDays": 45,
                    "PenaltyClause": 55
                },
                {
                    "ContractNumber": "CON0000067",
                    "ContractType": "Contract",
                    "AgentId": "AG0000002",
                    "GuaranteeDays": 20,
                    "Fees": 1500,
                    "ArrivalDays": 45,
                    "PenaltyClause": 55
                }
            ];

            var feesdata = [];
            var arrivalDaysData = [];
            var guarenteesDaysData = [];
            var penaltyClauseData = [];

            for (var i = 0; i < jsonData.length; i++) {
                feesdata.push({ y: jsonData[i].Fees, label: jsonData[i].ContractNumber });
                arrivalDaysData.push({ y: jsonData[i].ArrivalDays, label: jsonData[i].ContractNumber });
                guarenteesDaysData.push({ y: jsonData[i].GuaranteeDays, label: jsonData[i].ContractNumber });
                penaltyClauseData.push({ y: jsonData[i].PenaltyClause, label: jsonData[i].ContractNumber });
            }

            prepareChart("feechart", "Fees", feesdata);
            prepareChart("arrivalDaysData", "Arrival Days", arrivalDaysData);
            prepareChart("guarenteesDaysData", "Guarantee Days", guarenteesDaysData);
            prepareChart("penaltyClauseData", "Penalty Clause", penaltyClauseData);

            function prepareChart(chartId, chartTitle, data) {
                var chart = new CanvasJS.Chart(chartId, {
                    exportEnabled: true,
                    animationEnabled: true,
                    dataPointWidth: 30,
                    title: {
                        text: chartTitle
                    },
                    axisY: {
                        title: "Values"
                    },
                    axisX: {
                        title: "Contract Number"
                    },
                    data: [{
                        type: "column", // ✅ changed from "pie" to "column"
                        dataPoints: data,
                        indexLabel: "{y}",
                    }]
                });
                chart.render();
            }
        };
    </script>
</head>

<body>
    <div class="container mt-4">
        <div class="row">
            <div class="col">
                <div id="feechart" style="height: 370px; width: 100%;"></div>
            </div>
            <div class="col">
                <div id="arrivalDaysData" style="height: 370px; width: 100%;"></div>
            </div>
        </div>
        <div class="row mt-4">
            <div class="col">
                <div id="guarenteesDaysData" style="height: 370px; width: 100%;"></div>
            </div>
            <div class="col">
                <div id="penaltyClauseData" style="height: 370px; width: 100%;"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.canvasjs.com/canvasjs.min.js"></script>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
        crossorigin="anonymous">
    <!-- Bootstrap JS (with Popper) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>
</body>

</html>
