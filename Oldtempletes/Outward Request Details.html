<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Outward Request Details</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <style>
        body {
            background-color: #f9fafb;
            font-family: "Inter", sans-serif;
            color: #333;
        }

        .page-title {
            font-weight: 600;
            color: #005baa;
        }

        .outwardCard {
            border: none;
            border-radius: 12px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
            background: #fff;
            margin-bottom: 20px;
        }

        .outwardCard-header {
            background-color: #f0f4f8;
            border-bottom: 1px solid #e5e9ec;
            font-weight: 600;
            color: #005baa;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            margin-bottom: 8px;
        }

        .info-label {
            color: #6c757d;
            font-size: 0.9rem;
        }

        .info-value {
            font-weight: 500;
            color: #212529;
        }

        pre {
            background: #f4f6f9;
            padding: 15px;
            border-radius: 8px;
            max-height: 400px;
            overflow: auto;
            font-size: 0.9rem;
        }

        .badge-status {
            font-size: 0.9rem;
            padding: 0.5em 0.7em;
            border-radius: 6px;
        }

        .copy-btn {
            color: #849fbc;
            font-size: 13px;
            cursor: pointer;
            margin-left: 8px;
            user-select: none;
        }

        .outwardCard-body {
            padding: 5px;
        }

        .copy-btn:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body class="p-4">
    <div class="d-flex align-items-center justify-content-between mb-4">
        <div>
            <h4 class="page-title mb-0">Outward Request Details</h4>
            <p class="text-muted mb-0">View full details of the ZATCA API request</p>
        </div>
        <span id="statusBadge" class="badge-status"></span>
    </div>

    <div id="detailsContainer"></div>

    <script>
        const outwardRequest = {
            "EventId": null,
            "RequestURL": "https://gw-fatoora.zatca.gov.sa//e-invoicing/core/compliance",
            "Payload": "{\"csr\":\"LS0tLS1CRUdJTiBDRVJUSUZJQ0FURSBSRVFVRVNULS0tLS0KTUlJQ0dEQ0NBYjRDQVFBd2FERUxNQWtHQTFVRUJoTUNVMEV4SURBZUJnTlZCQXNNRjBobFlXUWdUMlptYVdObApJQzBnUTI5eWNHOXlZWFJsTVNNd0lRWURWUVFLREJwVFlYZGhhV1FnVW1WamNuVnBkRzFsYm5RZ1EyOXRjR0Z1CmVURVNNQkFHQTFVRUF3d0pVMkYzWVdsa1JWSlFNRll3RUFZSEtvWkl6ajBDQVFZRks0RUVBQW9EUWdBRVYxOTUKTGRFWFpibmxYNUZFNHFqM1hPQkMrNFl4OWpJUnUyUmZrcDBLNUpIeVQvRVV4V2xzMlBPZVovNjFab3pvL3EwUAprcTZzK1RCK1hYRVV3N0h6WXFDQjlqQ0I4d1lKS29aSWh2Y05BUWtPTVlIbE1JSGlNQ0VHQ1NzR0FRUUJnamNVCkFnUVVFeEphUVZSRFFTMURiMlJsTFZOcFoyNXBibWN3Z2J3R0ExVWRFUVNCdERDQnNhU0JyakNCcXpGVE1GRUcKQTFVRUJBeEtNUzFHWVdGNmZESXRVMkYzWVdsa0lGSmxZM0oxYVhSdFpXNTBJRU52YlhCaGJubDhNeTB3WXpjdwpNMk16TWkxbVkySTNMVFF6WkRFdE9HSmtaQzA1TnpJNE5tUTRNVEUwWlRneEh6QWRCZ29Ka2lhSmsvSXNaQUVCCkRBOHpNVEExTURNek56TTFNREF3TURNeERUQUxCZ05WQkF3TUJERXhNREF4RVRBUEJnTlZCQm9NQ0ZKVlVVRTAKTkRBNE1SRXdEd1lEVlFRUERBaE5ZVzV3YjNkbGNqQUtCZ2dxaGtqT1BRUURBZ05JQURCRkFpQUl3OHpLakdzZQpPOWF0RFNHSXdxNDZxN0FBeEEzT3lrclQrQ1NRV0h3RzBBSWhBS293Y2dSakRQL21zV21qLy9GNFdEUmQyemg5CnZENksvczNWQlNkMlIwVW4KLS0tLS1FTkQgQ0VSVElGSUNBVEUgUkVRVUVTVC0tLS0tCg==\"}",
            "ResponseCode": "200",
            "Response": "{\"requestID\":1747915469256,\"dispositionMessage\":\"ISSUED\"}",
            "Status": "OK",
            "Comments": null,
            "CreatedDatetime": "2025-05-22T17:34:30.48",
            "CreatedBy": "Onboard"
        };

        $(document).ready(function () {
            const d = outwardRequest;
            const statusColor = d.Status === "OK" ? "bg-success text-white" : "bg-danger text-white";
            $("#statusBadge").addClass(`badge ${statusColor}`).text(d.Status);

            const html = `
        <div class="outwardCard">
          <div class="outwardCard-header">Basic Information</div>
          <div class="outwardCard-body">
            <div class="info-row"><span class="info-label">Request URL</span>
              <span class="info-value">
                <code id="reqUrl">${d.RequestURL}</code>
                <span class="copy-btn" id="copyUrl">Copy</span>
              </span>
            </div>
            <div class="info-row"><span class="info-label">Response Code</span><span class="info-value">${d.ResponseCode}</span></div>
            <div class="info-row"><span class="info-label">Created By</span><span class="info-value">${d.CreatedBy}</span></div>
            <div class="info-row"><span class="info-label">Created Date</span><span class="info-value">${new Date(d.CreatedDatetime).toLocaleString()}</span></div>
          </div>
        </div>

        <div class="outwardCard">
          <div class="outwardCard-header">
            Payload 
            <span class="copy-btn" id="copyPayload">Copy</span>
          </div>
          <div class="outwardCard-body">
            <pre id="payloadContent">${syntaxHighlight(JSON.parse(d.Payload))}</pre>
          </div>
        </div>

        <div class="outwardCard">
          <div class="outwardCard-header">
            Response
            <span class="copy-btn" id="copyResponse">Copy</span>
          </div>
          <div class="outwardCard-body">
            <pre id="responseContent">${syntaxHighlight(JSON.parse(d.Response))}</pre>
          </div>
        </div>
      `;
            $("#detailsContainer").html(html);

            $("#copyUrl").click(() => copyContent('reqUrl'));
            $("#copyPayload").click(() => copyContent('payloadContent'));
            $("#copyResponse").click(() => copyContent('responseContent'));
        });

        function showToast(message, duration = 2000) {
            const toast = $('<div>')
                .text(message)
                .css({
                    position: 'fixed',
                    bottom: '30px',
                    right: '30px',
                    background: '#333',
                    color: '#fff',
                    padding: '10px 18px',
                    borderRadius: '6px',
                    boxShadow: '0 2px 10px rgba(0,0,0,0.2)',
                    fontSize: '14px',
                    opacity: '0',
                    transition: 'opacity 0.3s',
                    zIndex: 9999
                })
                .appendTo('body');

            setTimeout(() => toast.css('opacity', '1'), 10);
            setTimeout(() => {
                toast.css('opacity', '0');
                setTimeout(() => toast.remove(), 300);
            }, duration);
        }

        function copyContent(elementId) {
            const $el = $('#' + elementId);
            if ($el.length === 0) return;

            const text = $el.text().trim();
            if (!text) return;

            if (navigator.clipboard && document.hasFocus()) {
                navigator.clipboard.writeText(text)
                    .then(() => showToast('Copied to clipboard ✅'))
                    .catch(() => fallbackCopy(text, $el));
            } else {
                fallbackCopy(text, $el);
            }
        }

        function fallbackCopy(text, $el) {
            const $temp = $('<textarea>');
            $('body').append($temp);
            $temp.val(text).select();
            try {
                document.execCommand('copy');
                showToast('Copied to clipboard ✅');
            } catch (err) {
                console.error('Failed to copy', err);
            }
            $temp.remove();
        }

        function syntaxHighlight(json) {
            if (typeof json != 'string') json = JSON.stringify(json, undefined, 2);
            json = json.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            return json.replace(
                /("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|\b\d+\b)/g,
                match => {
                    let cls = 'text-danger';
                    if (/^"/.test(match)) cls = /:$/.test(match) ? 'text-primary' : 'text-success';
                    else if (/true|false/.test(match)) cls = 'text-info';
                    else if (/null/.test(match)) cls = 'text-muted';
                    return `<span class="${cls}">${match}</span>`;
                }
            );
        }
    </script>
</body>

</html>
