    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>


    <style>
        /* Stepper */
        .stepper {
            display: flex;
            justify-content: space-between;
            margin-bottom: 30px;
            counter-reset: step;
        }

        .stepper .step {
            text-align: center;
            position: relative;
            flex: 1;
        }

        .stepper .step:before {
            counter-increment: step;
            content: counter(step);
            width: 35px;
            height: 35px;
            border: 2px solid #dee2e6;
            display: block;
            margin: 0 auto 10px auto;
            border-radius: 50%;
            background: #fff;
            line-height: 31px;
            font-weight: bold;
            color: #adb5bd;
        }

        .stepper .step.active:before {
            border-color: #fdbd3f;
            background: #fdbd3f;
            color: #fff;
        }

        .stepper .step:after {
            content: '';
            position: absolute;
            width: 100%;
            height: 2px;
            background: #dee2e6;
            top: 17px;
            left: -50%;
            z-index: -1;
        }

        .stepper .step:first-child:after {
            content: none;
        }

        .stepper .step.active~.step:before {
            background: #fff;
            color: #adb5bd;
            border-color: #dee2e6;
        }

        .stepper .step.active:after {
            background: #fdbd3f;
        }

        /* Loader */
        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #fdbd3f;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            animation: spin 1s linear infinite;
            display: inline-block;
            vertical-align: middle;
            margin-left: 8px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .nextBtn {
            background-color: #fdbd3f;
        }
    </style>
</head>
