        function renderAccordion(filteredData) {
            const groupedData = {};
            filteredData.forEach(item => {
                if (!groupedData[item.ContractNumber]) {
                    groupedData[item.ContractNumber] = [];
                }
                groupedData[item.ContractNumber].push(item);
            });

                const group = groupedData[contractNumber];

                const $accordion = $('<div class="accordion"></div>');
                const headerItem = group[group.length - 1]; // use first item for header details

                const $header = $(`
    <div class="accordion-header">
        <div><strong>Contract Number:</strong> ${headerItem.ContractNumber}</div>
        <div><strong>Contract Date:</strong> ${headerItem.ContractDate?.split('T')[0] ?? '-'}</div>
        <div><strong>Status:</strong> ${headerItem.ContractStatus ?? '-'}</div>
        <div><strong>Type:</strong> ${headerItem.ContractType ?? '-'}</div>
        <div><strong>Nationality:</strong> ${headerItem.Nationality ?? '-'}</div>
        <div><strong>Sector:</strong> ${headerItem.ContractSector ?? '-'}</div>
        <div><strong>Arrival Days:</strong> ${headerItem.ContractArrivalDays ?? '-'}</div>
        <div><strong>Guarantee Days:</strong> ${headerItem.ContractGuaranteeDays ?? '-'}</div>
        <div><strong>Fees:</strong> ${headerItem.ContractFees ?? '-'}</div>
        <div><strong>Penalty Clause:</strong> ${headerItem.ContractPenaltyClause ?? '-'}</div>
    </div>
`);

                const $body = $('<div class="accordion-body"></div>');

                const $table = $('<table></table>');
                const $thead = $(`
                    <thead><tr>
                        <th>Appendix Id</th><th>Status</th><th>Type</th><th>From Date</th><th>To Date</th><th>Effective Duration</th><th>Arrival Days</th><th>Guarantee Days</th>
                        <th>Fees</th><th>Penalty Clause</th><th>Created Date</th>
                    </tr></thead>
                `);
                const $tbody = $('<tbody></tbody>');

                group.forEach(item => {
                    const fromDate = item.FromDate ? item.FromDate.split('T')[0] : '-';
                    const toDate = item.ToDate ? item.ToDate.split('T')[0] : '-';
                    const createdDate = item.CreatedDatetime ? item.CreatedDatetime.split('T')[0] : '-';

                    $tbody.append(`
                        <tr>
                            <td>${item.AppendixId}</td>
                            <td>${item.Status}</td>
                            <td>${item.Type}</td>
                            <td>${fromDate}</td>
                            <td>${toDate}</td>
                            <td>${item.EffectiveDuration}</td>
                            <td>${item.ArrivalDays ?? '-'}</td>
                            <td>${item.GuaranteeDays ?? '-'}</td>
                            <td>${item.Fees ?? '-'}</td>
                            <td>${item.PenaltyClause ?? '-'}</td>
                            <td>${createdDate}</td>
                        </tr>
                    `);
                });

                $table.append($thead);
                $table.append($tbody);
                $body.append($table);

                $accordion.append($header);
                $accordion.append($body);
                container.append($accordion);
            });
        }

        $(document).on('click', '.accordion-header', function () {
            $(this).next('.accordion-body').slideToggle();
        });

        $('#searchInput').on('keyup', function () {
            const keyword = $(this).val().toLowerCase();
            const filtered = data.filter(item =>
                item.ContractNumber.toLowerCase().includes(keyword) ||
                item.AgentId.toLowerCase().includes(keyword)
            );
            if (filtered.length === 0) {
                toastr.warning("No matching contract or agent found.");
            }
            renderAccordion(filtered.length ? filtered : data);
        });

        renderAccordion(data);
    </script>
</body>

</html>
