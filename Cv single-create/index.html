<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Candidate CV</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="singlecreatecvcontainer">
    <div class="app-wrapper">
        <form id="cvForm" class="dashboard-form">
            
            <!-- LEFT PANEL: Personal Info -->
            <div class="left-panel">
                <div class="profile-header">
                    <div class="avatar-ring">
                        <img id="profilePreview" src="https://ui-avatars.com/api/?name=User&background=FFF9F0&color=F8B633" alt="Profile">
                    </div>
                    <div class="header-text">
                        <h1>Candidate Profile</h1>
                        <label for="ProfileImage" class="upload-link">Upload Photo</label>
                        <input type="file" id="ProfileImage" name="ProfileImage" hidden accept="image/*">
                    </div>
                </div>

                <div class="section-title">Personal Information</div>
                <div class="grid g-2">
                    <div class="field span-2">
                        <label>Full Name</label>
                        <input type="text" id="Name" name="Name" required>
                    </div>
                    <div class="field">
                        <label>Date of Birth</label>
                        <input type="date" id="DateofBirth" name="DateofBirth" required>
                    </div>
                    <div class="field">
                        <label>Age</label>
                        <input type="number" id="Age" name="Age" readonly>
                    </div>
                    <div class="field">
                        <label>Gender</label>
                        <select id="Gender" name="Gender" required>
                            <option value="">Select Gender</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                        </select>
                    </div>
                    <div class="field">
                        <label>Marital Status</label>
                        <select id="MaritalStatus" name="MaritalStatus">
                            <option value="">Select Status</option>
                            <option value="Single">Single</option>
                            <option value="Married">Married</option>
                            <option value="Divorced">Divorced</option>
                            <option value="Widowed">Widowed</option>
                        </select>
                    </div>
                    <div class="field span-2">
                        <label>Nationality</label>
                        <select id="Nationality" name="Nationality" required>
                            <option value="">Loading...</option>
                        </select>
                    </div>
                    <div class="field span-2">
                        <label>Place of Birth</label>
                        <input type="text" id="PlaceofBirth" name="PlaceofBirth">
                    </div>
                    <div class="field span-2">
                        <label>Phone Number</label>
                        <input type="tel" id="PhoneNumber" name="PhoneNumber">
                    </div>
                    
                    <div class="field span-2" style="margin-top: 12px;">
                        <label>Full Size Photo</label>
                        <div class="file-drop-area" id="fullSizeDropArea" onclick="document.getElementById('FullSizeImage').click()">
                            <div class="upload-icon-wrapper" id="fullSizeIcon">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                            </div>
                            <div class="file-drop-text" id="fullSizeDropText">
                                <span class="drop-msg">Click or drag image here</span>
                                <span class="drop-submsg">SVG, PNG, JPG...</span>
                            </div>
                            <img id="fullSizePreviewImg" style="display: none; max-width: 100%; max-height: 250px; border-radius: 8px; object-fit: contain; margin-bottom: 8px;">
                            <input type="file" id="FullSizeImage" name="FullSizeImage" accept="image/*" hidden>
                            <div class="file-preview-name" id="fullSizeFileName"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- RIGHT PANEL: Professional, Skills, Languages, Experience -->
            <div class="right-panel">
                
                <div class="section-title">Professional Details</div>
                <div class="grid g-4" style="margin-bottom: 24px;">
                    <div class="field span-2">
                        <label>Profession</label>
                        <select id="Profession" name="Profession" required>
                            <option value="">Loading...</option>
                        </select>
                    </div>
                    <div class="field span-1">
                        <label>Education Level</label>
                        <select id="EducationLevel" name="EducationLevel[]" multiple required>
                            <option value="">Loading...</option>
                        </select>
                    </div>
                    <div class="field span-1">
                        <label>Monthly Salary</label>
                        <input type="number" id="MonthlySalary" name="MonthlySalary">
                    </div>
                </div>

                <div class="grid g-4" style="margin-bottom: 24px;">
                    <div class="field span-2">
                        <label>Passport Number</label>
                        <input type="text" id="PassportNumber" name="PassportNumber">
                    </div>
                    <div class="field span-1">
                        <label>Religion</label>
                        <input type="text" id="Religion" name="Religion">
                    </div>
                    <div class="field span-1">
                        <label>Children</label>
                        <input type="number" id="NumberofChildren" name="NumberofChildren">
                    </div>
                    <div class="field span-2">
                        <label>Height (cm)</label>
                        <input type="number" id="Height" name="Height">
                    </div>
                    <div class="field span-2">
                        <label>Weight (kg)</label>
                        <input type="number" id="Weight" name="Weight">
                    </div>
                </div>

                <div class="dynamic-panels">
                    <div class="dynamic-card">
                        <div class="card-header">
                            <span class="section-title">Skills</span>
                            <button type="button" id="addSkillBtn" class="btn-icon" title="Add Skill">+</button>
                        </div>
                        <div id="skillsContainer" class="dynamic-container"></div>
                    </div>

                    <div class="dynamic-card">
                        <div class="card-header">
                            <span class="section-title">Languages</span>
                            <button type="button" id="addLanguageBtn" class="btn-icon" title="Add Language">+</button>
                        </div>
                        <div id="languagesContainer" class="dynamic-container"></div>
                    </div>
                </div>

                <div class="dynamic-card" style="margin-bottom: 24px;">
                    <div class="card-header">
                        <span class="section-title">Experience</span>
                        <button type="button" id="addExperienceBtn" class="btn-icon" title="Add Experience">+</button>
                    </div>
                    <div id="experienceContainer" class="dynamic-container"></div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn-primary">Save Profile</button>
                </div>

            </div>
            
            <!-- TEMPLATES -->
            <template id="skillTemplate">
                <div class="dynamic-item">
                    <button type="button" class="btn-remove-item" title="Remove">&times;</button>
                    <div class="field">
                        <label>Skill Name</label>
                        <input type="text" name="SkillName[]" placeholder="E.g. JavaScript" required>
                    </div>
                </div>
            </template>

            <template id="languageTemplate">
                <div class="dynamic-item">
                    <button type="button" class="btn-remove-item" title="Remove">&times;</button>
                    <div class="grid g-2">
                        <div class="field">
                            <label>Language</label>
                            <input type="text" name="Language[]" placeholder="E.g. English" required>
                        </div>
                        <div class="field">
                            <label>Proficiency</label>
                            <select name="Proficiency[]" class="proficiency-select" required>
                                <option value="">Select Proficiency</option>
                                <option value="Beginner">Beginner</option>
                                <option value="Intermediate">Intermediate</option>
                                <option value="Advanced">Advanced</option>
                                <option value="Native">Native</option>
                            </select>
                        </div>
                    </div>
                </div>
            </template>

            <template id="experienceTemplate">
                <div class="dynamic-item">
                    <button type="button" class="btn-remove-item" title="Remove">&times;</button>
                    <div class="grid g-6">
                        <div class="field span-2">
                            <label>Workplace</label>
                            <input type="text" name="Workplace[]" placeholder="Company Name">
                        </div>
                        <div class="field span-1">
                            <label>Duration (Yrs)</label>
                            <input type="number" step="0.1" min="0" name="Experienceduration[]" placeholder="5.5">
                        </div>
                        <div class="field span-1">
                            <label>Country</label>
                            <select name="Country[]" class="country-select dynamic-country">
                                <option value="">Select</option>
                            </select>
                        </div>
                        <div class="field span-2">
                            <label>Position</label>
                            <input type="text" name="ExpPosition[]" placeholder="Job Title">
                        </div>
                        <div class="field span-full">
                            <label>Roles & Responsibilities</label>
                            <textarea name="Roles[]" rows="1" placeholder="Responsibilities..."></textarea>
                        </div>
                    </div>
                </div>
            </template>

            <!-- Hidden Fields for Descriptions -->
            <input type="hidden" id="Profession_Des" name="Profession_Des">
            <input type="hidden" id="Profession_DesAr" name="Profession_DesAr">
            <input type="hidden" id="Nationality_Des" name="Nationality_Des">
            <input type="hidden" id="Nationality_DesAr" name="Nationality_DesAr">

        </form>
    </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
