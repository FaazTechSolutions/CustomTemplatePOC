<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coordinator My Dashboard</title>
  
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- FontAwesome for Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css">

</head>
<body>
  <!-- Layout Wrapper -->
  <div class="dashboard-wrapper">
    
    <!-- Main Content -->
    <main class="main-content">
      
      <!-- Dashboard View -->
      <div class="dashboard-container">
        <div class="page-title">
          <h1>Coordinator My Dashboard</h1>
          <p>Overview of your team's ticket assignments and status</p>
        </div>

        <!-- My Team Tickets Grid -->
        <div class="section-card" style="margin-bottom: 24px;">
          <div class="section-header">
            <h3><i class="fa-solid fa-users"></i> My Tickets</h3>
          </div>
          
          <div class="team-tickets-grid" id="my-team-tickets-container">
            <!-- JS Populated Cards -->
          </div>
        </div>

      </div>
    </main>
  </div>

  <!-- Custom Script -->
  <script src="script.js"></script>
</body>
</html>
