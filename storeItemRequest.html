<!DOCTYPE html>

    <style>
        .store-request-container .badge-title {
            background: #fff;
            position: absolute;
            top: -8px;
            padding: 0 5px;
            font-weight: bold;
        }
        .store-request-container select option, .store-request-container select,.form-control {
        font-size: 12px;
        }
        .required {
            color: red;
        }
        /* Loader */
        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #fdbd3f;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            animation: spin 1s linear infinite;
            display: inline-block;
            vertical-align: middle;
            margin-left: 8px;
        }
        .readOnly {
        opacity: 0.5 !important;
        pointer-events: none;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>

        function getReportingManagerForEmployee() {
            showLoader('submitHeader');
            // API URL
            const apiUrl = `${bcpURL}/api/v1/erp/getReportingManagerForEmployee?_employeeid=${currentEmployeeId}&_Company=MWD&user-id=${userIdDefault}`;
            // Make API call
            fetch(apiUrl, {
                method: "GET",
                headers: {
                    "Content-Type": "application/json"
                }
            })
                .then(response => {
                    return response.json();
                })
                .then(data => {
                    if(typeof data === 'string'){
                        Swal.fire("Error", data, "error");
                        return
                    }
                    $("#ApprovalManagerName").val(data.RetListValue[0].reportingEmployeeName);
                    $('#approvalmanagernametextstore').html(data.RetListValue[0].reportingEmployeeName);
                    $("#ApprovalManager").val(data.RetListValue[0].reportingEmployeeId);
                    hideLoader('submitHeader');
                    getApprovalManagerUserIdByEmployeeId(data.RetListValue[0].reportingEmployeeId);
                })
                .catch(error => {
                    console.error("Error fetching data:", error);
                    hideLoader('submitHeader');
                });
        }
        function getItemList() {
            showLoader('submitLines');
            const apiUrl = `${bcpURL}/api/v1/erp/ExecutGetProductListRequest`;
            fetch(apiUrl, {
                method: "GET",
                headers: {
                    "Content-Type": "application/json",
                    "User-Id":userId
                }
            })
                .then(response => {
                    return response.json();
                })
                .then(data => {
                    if(data.Success === true){
                        hideLoader('submitLines');
                    let $dropdown = $('#ItemId');
                    $dropdown.empty(); // Clear previous options

                    // Loop through the response and append options
                    $.each(data.Return, function(index, item) {
                        $dropdown.append(
                            $('<option>', {
                                value: item.ProductNumber,
                                text: `${item.ProductNumber} | ${item.NameAlias} | ${item.PurchPrice}`
                            })
                        );
                    });
                    }else{
                        hideLoader('submitLines');
                        Swal.fire("Error", data.Message ? data.Message : data, "error");
                    }

                })
                .catch(error => {
                     hideLoader('submitLines');
                    console.error("Error fetching data:", error);
                });
        }

        function showLoader(btn){
            const $loader = $('<span class="loader"></span>');
            const $btn = $(`#${btn}`);
            $btn.find('.loader').remove();
            $btn.prop('disabled', true).append($loader);
        }
        function hideLoader(btn){
            const $btn = $(`#${btn}`);
            $btn.find('.loader').remove();
            $btn.prop('disabled', false);
        }

        function submitHeader() {
            showLoader('submitHeader');
            const payload = {
                "EmployeeId": $("#EmployeeId").val(),
                "PersonnelNumber": $("#EmployeeId").val(),
                "EmployeeName": $("#EmployeeName").val(),
                "ApprovalManager": $("#ApprovalManager").val(),
                "ApprovalManagerName": $("#ApprovalManagerName").val(),
                "ApprovalManagerUserId": $("#ApprovalManagerUserId").val(),
                "Description": $("#Description").val(),
                "TransDate": toIsoWithCurrentTime($("#TransDate").val()),
                "EntityId": StoreItemTableEntityId,
                "Status": "Draft",
                "Company":"MWD"
            }

            try {
                const apiUrl = `${Apps4xApiUrl}api/v1/data/${companyId}/create`;
                const formData = new FormData();
                let _entityData = JSON.stringify(payload);
                formData.append("EntityData", _entityData);
                //uncomment
                fetch(apiUrl, {
                    method: "POST",
                    headers: {
                        "Authorization": "Bearer " + token,
                        "User-Id": userId,
                        "appid": appId,
                        "CompanyId": companyId
                    },
                    body: formData
                })
                    .then(response => {
                        return response.json();
                    })
                    .then(data => {
                        if(typeof data === "string"){
                            Swal.fire("Error", data, "error");
                            return
                        }                        
                        hideLoader('submitHeader');
                        showLoader('submitLines');
                        getDetails(data);
                        const $linesSection = $('#linesSection');
                        $linesSection.removeClass('d-none');                        
                        const $headerContainer = $('#headerContainer');
                        $headerContainer.addClass('d-none');                        
                        const $DescriptionContainer = $('#DescriptionContainer');
                        $DescriptionContainer.addClass('readOnly');                      
                        const $TransDateContainer = $('#TransDateContainer');
                        $TransDateContainer.addClass('readOnly');                        
                        $('#TransDate').prop('readonly', true);
                        $('#Description').prop('readonly', true);
                        
                    })
                    .catch(error => {
                        Swal.fire("Error", JSON.stringify(error.message), "error");
                        console.error("Error fetching data:", error.message);
                        hideLoader('submitHeader');
                    });
            } catch (err) {
                hideLoader('submitHeader');
                console.error("API Error:", err);
                alert(handlebarCompile("{{Translate 'Something went wrong while submitting Store Item request'}}"));
            }
        }

        function resetLines(RecId){
            const ItemId = $("#ItemId").val();
            const ItemName = $("#ItemName").val();
            const Qty = $("#Qty").val();
            const Description = $("#DescriptionLines").val();
            const Reference = $("#Reference").val();
            const RefRecId = $("#RefRecId").val();
            itemLines.push({ItemId,ItemName,Qty,Description,Reference,RefRecId,RecId})
            generatetable();
        $("#ItemId").val('');
        $("#ItemName").val('');
        $("#Qty").val('');
        $("#DescriptionLines").val('');
        }
        function generatetable(){

            var table = $('<table>', { class: 'table', border: '1' }); // Create a table element
            var thead = $('<thead>'); // Create the table header
            var tbody = $('<tbody>'); // Create the table body

            // Create the header row and append to the table header
            var headerRow = $('<tr>');
            headerRow.append(handlebarCompile(`<th>{{Translate 'Rec Id'}}</th>`));
            headerRow.append(handlebarCompile(`<th>{{Translate 'Item Id'}}</th>`));
            headerRow.append(handlebarCompile(`<th>{{Translate 'Item Name'}}</th>`));
            headerRow.append(handlebarCompile(`<th>{{Translate 'Qty'}}</th>`));
            headerRow.append(handlebarCompile(`<th>{{Translate 'Reference'}}</th>`));
            headerRow.append(handlebarCompile(`<th>{{Translate 'Ref Rec Id'}}</th>`));
            headerRow.append(handlebarCompile(`<th>{{Translate 'Description'}}</th>`));

            thead.append(headerRow);

            // Loop through the data array and create rows
            $.each(itemLines, function(index, item) {
                var row = $('<tr>');
                row.append('<td>' + item.RecId + '</td>');
                row.append('<td>' + item.ItemId + '</td>');
                row.append('<td>' + item.ItemName + '</td>');
                row.append('<td>' + item.Qty + '</td>');
                row.append('<td>' + item.Reference + '</td>');
                row.append('<td>' + item.RefRecId + '</td>');
                row.append('<td>' + item.Description + '</td>');
                tbody.append(row);
            });

            // Append the header and body to the table
            table.append(thead);
            table.append(tbody);

            $('#linestable').html(table);
        }
        function getApprovalManagerUserIdByEmployeeId(ApprovalManagerEmployeeId) {
            showLoader('submitHeader');
            const apiUrl = `${Apps4xApiUrl}api/v1/data/${companyId}?collectionId=${UserTableCollectionId}&entityid=${UserTableEntityId}&$filter:EmployeeId=li:${ApprovalManagerEmployeeId}`;
            // Make API call
            fetch(apiUrl, {
                method: "GET",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": "Bearer " + token,
                    "User-Id": userId,
                    "appid": AdministrationAppId,
                    "CompanyId": companyId
                }
            })
                .then(response => {
                    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                    return response.json();
                })
                .then(data => {
                    if(data && data.Data && data.Data.length > 0){
                    $("#ApprovalManagerUserId").val(data.Data[0].UserId);
                    }
                    hideLoader('submitHeader');
                })
                .catch(error => {
                    console.error("Error fetching data:", error);
                    hideLoader('submitHeader');
                });
        }

            // Make API call
            fetch(apiUrl, {
                method: "GET",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": "Bearer " + token,
                    "User-Id": userId,
                    "appid": AdministrationAppId,
                    "CompanyId": companyId
                }
            })
                .then(response => {
                    return response.json();
                })
                .then(data => {
                    if(data){
                    $("#RefRecId").val(data.RecId);
                    $("#Reference").val(data.Reference);
                    }
                    hideLoader('submitLines');
                    getItemList();
                })
                .catch(error => {
                    console.error("Error fetching data:", error);
                    hideLoader('submitLines');
                });
        }
        

        function toIsoWithCurrentTime(dateStr) {
            if (!dateStr) {
                return null;
            }
            const todayTime = new Date();
            const d = new Date(dateStr);
            return d.toISOString();
        }

    </script>
